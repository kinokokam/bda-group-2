# Slim Airflow: one container, built-in SQLite database, one task at a time (`airflow standalone`).
#   cd bq2/airflow && docker compose up --build     then open http://localhost:8080
# The admin password is printed in the log and saved in bq2/airflow/.airflow-home/standalone_admin_password.txt
services:
  airflow:
    build: .
    command: standalone
    ports: ["8080:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/bq2/airflow/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"   # nothing runs until you switch a DAG on
      PYTHONPATH: /opt/bq2
      AML_BUCKET: aml-bq2
      AML_SQL_DIR: /opt/bq2/sql
      AML_FX_RATES: /aml-fx/fx_rates.csv              # same bytes as s3://aml-bq2/reference/fx/fx_rates.csv
      AWS_PROFILE: aml-bq2
      AWS_REGION: ap-southeast-1
      # Only the aml-bq2 profile, from its own folder; never all of ~/.aws (it holds ShopBack profiles)
      AWS_CONFIG_FILE: /aws-aml-bq2/config
      AWS_SHARED_CREDENTIALS_FILE: /aws-aml-bq2/credentials
    volumes:
      - ..:/opt/bq2                                  # BQ2 code, SQL and out/ (slices, live model, results)
      - ../../tests:/opt/tests:ro
      - ../../pyproject.toml:/opt/pyproject.toml:ro
      - ~/.aws-aml-bq2:/aws-aml-bq2:ro
      - ~/aml_data/aml_out/fx_rates.csv:/aml-fx/fx_rates.csv:ro   # the monitor's FX table, nothing else from ~/aml_data
      - ./.airflow-home:/opt/airflow                 # Airflow's database and logs
